version: 2
models:
  - name: dim_customers
    description: "This table contains customer information."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."
      - name: email
        description: "Customer's email address."
        tests:
          - unique
          - not_null
      - name: phone_number
        description: "Customer's phone number."
      - name: membership_tier
        description: "Customer's membership tier (e.g., Silver, Gold, Platinum)."
        tests:
          - not_null
          - accepted_values:
              values: ['PLATINUM', 'GOLD', 'DIAMOND', 'SILVER']
      - name: registration_date
        description: "Date when the customer registered."
        tests:
          - not_null
      - name: status
        description: "Current status of the customer (e.g., Active, Inactive)."
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE']
  - name: dim_hotels
    description: "This table contains hotel information."
    columns:
      - name: hotel_id
        description: "Unique identifier for each hotel."
        tests:
          - unique
          - not_null

      - name: hotel_name
        description: "Name of the hotel."
        tests:
          - not_null

      - name: hotel_chain
        description: "The chain or brand the hotel belongs to."
        tests:
          - not_null
    
      - name: star_rating
        description: "Star rating of the hotel (1 to 5)."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

      - name: OPENED_DATE
        description: "Date when the hotel was opened."
        tests:
          - not_null

      - name: hotel_status 
        description: "Current operational status of the hotel (e.g., Open, Closed, Renovation)."
        tests:
            - not_null
            - accepted_values:
                values: ['OPEN', 'CLOSED', 'RENOVATION']

  - name: dim_employees
    description: "This table contains employee information."
    columns:
      - name: employee_id
        description: "Unique identifier for each employee."
        tests:
          - unique
          - not_null

      - name: first_name
        description: "Employee's first name."
        tests:
          - not_null

      - name: last_name
        description: "Employee's last name."
        tests:
          - not_null

      - name: department
        description: "Department where the employee works (e.g., Front Desk, Housekeeping, Management)."
        tests:
          - not_null

      - name: designation
        description: "Job position of the employee (e.g., Manager, Receptionist, Housekeeping)."
        tests:
          - not_null

      - name: hire_date
        description: "Date when the employee was hired."
        tests:
          - not_null

      - name: status
        description: "Current employment status of the employee (e.g., Active, Inactive, On Leave)."
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE', 'ON LEAVE','RESIGNED', 'TERMINATED']

  - name: dim_rooms
    description: "This table contains room information."
    columns:
      - name: room_id
        description: "Unique identifier for each room."
        tests:
          - unique
          - not_null

      - name: hotel_id
        description: "Identifier for the hotel to which the room belongs."
        tests:
          - not_null
        relationships:
            - to: ref('dim_hotels')
              field: hotel_id

      - name: room_number
        description: "Room number within the hotel."
        tests:
          - not_null

      - name: room_type
        description: "Type of the room (e.g., Standard, Double, Suite)."
        tests:
          - not_null
          - accepted_values:
              values: ['Standard', 'Deluxe', 'Suite', 'Family', 'Presidential', 'Executive', 'Junior Suite', 'Studio', 'Apartment', 'Villa']

      - name: capacity
        description: "Maximum number of guests the room can accommodate."
        tests:
          - not_null


      - name: base_price
        description: "Price per night for the room."
        tests:
          - not_null

      - name: status
        description: "Current availability status of the room (e.g., Available, Occupied, Maintenance)."
        tests:
          - not_null
          - accepted_values:
              values: ['AVAILABLE', 'OCCUPIED', 'MAINTENANCE']

      - name: dim_promotions
        description: "This table contains promotion information."
        columns:
          - name: promotion_id
            description: "Unique identifier for each promotion."
            tests:
              - unique
              - not_null

          - name: campaign_name
            description: "Name of the promotion."
            tests:
              - not_null

          - name: start_date
            description: "Start date of the promotion."
            tests:
              - not_null

          - name: end_date
            description: "End date of the promotion."
            tests:
              - not_null

          - name: discount_percentage
            description: "Discount percentage offered by the promotion."
            tests:
              - not_null

          - name: promotion_status
            description: "Current status of the promotion (e.g., Active, Expired, Upcoming)."
            tests:
              - not_null
              - accepted_values:
                  values: ['ACTIVE', 'EXPIRED', 'UPCOMING']
version: 2
models:
  - name: fact_bookings
    description: "This table contains booking information."
    columns:
      - name: booking_id
        description: "Unique identifier for each booking."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier for the customer who made the booking."
        tests:
          - not_null
        relationships:
          - to: ref('dim_customers')
            field: customer_id


      - name: hotel_id
        description: "Identifier for the hotel where the booking was made."
        tests:
          - not_null
        relationships:
          - to: ref('dim_hotels')
            field: hotel_id

      - name: room_id
        description: "Identifier for the room that was booked."
        tests:
          - not_null
        relationships:
          - to: ref('dim_rooms')
            field: room_id

      - name: promotion_id
        description: "Identifier for the promotion applied to the booking, if any."
        tests:
          - not_null
        relationships:
          - to: ref('dim_promotions')
            field: promotion_id

      - name: booking_date
        description: "Date when the booking was made."
        tests:
          - not_null

      - name: check_in_date
        description: "Date when the customer is scheduled to check in."
        tests:
          - not_null

      - name: check_out_date
        description: "Date when the customer is scheduled to check out."
        tests:
          - not_null

      - name: booking_status
        description: "Current status of the booking (e.g., Confirmed, Cancelled)."
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLETED', 'CANCELLED', 'CONFIRMED', 'NO SHOW', 'PENDING']

      - name: currency
        description: "Currency in which the booking was made."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when the booking record was created."
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the booking record was last updated."
        tests:
          - not_null

  - name: fact_payments
    description: "This table contains payment information."
    columns:
      - name: payment_id
        description: "Unique identifier for each payment."
        tests:
          - unique
          - not_null

      - name: booking_id
        description: "Identifier for the booking associated with the payment."
        tests:
          - not_null
        relationships:
          - to: ref('fact_bookings')
            field: booking_id

      - name: payment_date
        description: "Date when the payment was made."
        tests:
          - not_null

      

      - name: method
        description: "Method used for the payment (e.g., Credit Card, Cash, Online Payment)."
        tests:
          - not_null
          - accepted_values:
              values: ['Credit Card', 'Cash', 'Net Banking', 'Debit Card', 'Mobile Payment','Upi', 'Cheque', 'Wallet', 'Other']

      - name: currency
        description: "Currency in which the payment was made."
        tests:
          - not_null

      - name: payment_amount
        description: "Amount paid."
        tests:
          - not_null

      - name: payment_status
        description: "Current status of the payment (e.g., Completed, Pending, Failed)."
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLETED', 'PENDING', 'FAILED', 'REFUNDED', 'CANCELLED','PAID', 'PARTIALLY PAID']

      - name: transaction_reference
        description: "Reference number for the payment transaction."
        tests:
          - not_null


  - name: fact_room_services
    description: "This table contains room service information."
    columns:
      - name: service_id
        description: "Unique identifier for each room service request."
        tests:
          - unique
          - not_null

      - name: booking_id
        description: "Identifier for the booking associated with the room service."
        tests:
          - not_null
        relationships:
          - to: ref('fact_bookings')
            field: booking_id

      - name: hotel_id
        description: "Identifier for the hotel where the room service was requested."
        tests:
          - not_null
        relationships:
          - to: ref('dim_hotels')
            field: hotel_id

      - name: employee_id
        description: "Identifier for the employee who provided the room service."
        tests:
          - not_null
        relationships:
          - to: ref('dim_employees')
            field: employee_id

      - name: service_date
        description: "Date when the room service was requested."
        tests:
          - not_null

      - name: service_name
        description: "Name of the room service requested (e.g., Food, Cleaning, Laundry)."
        tests:
          - not_null

      - name: quantity
        description: "Quantity of the room service requested."
        tests:
          - not_null

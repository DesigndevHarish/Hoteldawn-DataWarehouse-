version: 2

models:

  # ============================================================
  # 1. HOTEL PERFORMANCE
  # ============================================================

  - name: hotel_performance
    description: >
      Provides hotel-level performance metrics including bookings,
      revenue, average price, revenue per night, hotel ranking,
      and hotel age.

    columns:

      - name: hotel_id
        description: "Unique identifier of the hotel."
        tests:
          - not_null
          - unique

      - name: hotel_name
        description: "Name of the hotel."
        tests:
          - not_null

      - name: booking_count
        description: "Total number of confirmed and completed bookings."
        tests:
          - not_null

      - name: total_revenue_inr
        description: "Total booking revenue converted to INR."
        tests:
          - not_null

      - name: performance_rank
        description: "Hotel ranking based on total revenue."


  # ============================================================
  # 2. HOTEL REVENUE TREND
  # ============================================================

  - name: hotel_revenue_trend
    description: >
      Monthly hotel revenue trend showing previous month revenue,
      revenue difference, percentage change, and revenue trend.

    columns:

      - name: hotel_id
        description: "Unique identifier of the hotel."
        tests:
          - not_null

      - name: revenue_month
        description: "Month used for revenue analysis."
        tests:
          - not_null

      - name: monthly_revenue_inr
        description: "Total revenue generated by the hotel during the month."
        tests:
          - not_null

      - name: revenue_trend
        description: >
          Indicates whether revenue is incrementing, decrementing,
          unchanged, or represents a new period.


  # ============================================================
  # 3. HOTEL OCCUPANCY
  # ============================================================

  - name: hotel_occupancy
    description: >
      Measures hotel room utilization using booked room nights
      compared with operable room nights.

    columns:

      - name: hotel_id
        description: "Unique identifier of the hotel."
        tests:
          - not_null

      - name: booked_room_nights
        description: "Total number of room nights booked."

      - name: operable_room_nights
        description: "Total number of room nights available for operation."

      - name: occupancy_percentage
        description: "Percentage of operable room nights that were booked."


  # ============================================================
  # 4. CUSTOMER ANALYSIS
  # ============================================================

  - name: customer_analysis
    description: >
      Evaluates customer value using bookings, nights, revenue,
      average booking value, customer type, and revenue ranking.

    columns:

      - name: customer_id
        description: "Unique identifier of the customer."
        tests:
          - not_null
          - unique

      - name: total_bookings
        description: "Total number of confirmed and completed bookings."

      - name: total_revenue_inr
        description: "Total revenue generated by the customer."

      - name: average_booking_value
        description: "Average revenue generated per booking."

      - name: customer_revenue_rank
        description: "Customer ranking based on total revenue."

      - name: customer_value_badge
        description: "Business classification based on customer revenue."


  # ============================================================
  # 5. BOOKING CHANNEL ANALYSIS
  # ============================================================

  - name: booking_channel_analysis
    description: >
      Compares booking channels based on bookings, customers,
      nights, revenue, and average booking value.

    columns:

      - name: booking_channel
        description: "Channel through which the booking was made."
        tests:
          - not_null
          - unique

      - name: total_bookings
        description: "Total confirmed and completed bookings."

      - name: unique_customers
        description: "Number of unique customers using the channel."

      - name: total_revenue_inr
        description: "Total revenue generated through the channel."

      - name: revenue_contribution_percentage
        description: "Percentage contribution of the channel to total revenue."


  # ============================================================
  # 6. PROMOTION ANALYSIS
  # ============================================================

  - name: promotion_performance
    description: >
      Measures promotion performance using bookings, revenue,
      discounts, booking value, and revenue per night.

    columns:

      - name: promotion_id
        description: "Unique identifier of the promotion."
        tests:
          - not_null

      - name: total_bookings
        description: "Total confirmed and completed bookings using the promotion."

      - name: total_revenue_inr
        description: "Total revenue generated through the promotion."

      - name: total_discount_inr
        description: "Total discount amount associated with the promotion."

      - name: average_discount_percentage
        description: "Average discount percentage applied."

      - name: discount_impact_percentage
        description: "Percentage of original booking value given as discount."


  # ============================================================
  # 7. HOTEL CUSTOMER RETENTION
  # ============================================================

  - name: hotel_customer_retention
    description: >
      Measures customer retention for each hotel by identifying
      new and repeat customers.

    columns:

      - name: hotel_id
        description: "Unique identifier of the hotel."
        tests:
          - not_null

      - name: total_customers
        description: "Total unique customers associated with the hotel."

      - name: new_customers
        description: "Customers with one confirmed or completed booking."

      - name: repeat_customers
        description: "Customers with more than one confirmed or completed booking."

      - name: repeat_customer_percentage
        description: "Percentage of customers who made repeat bookings."


  # ============================================================
  # 8. ROOM PERFORMANCE
  # ============================================================

  - name: room_performance
    description: >
      Evaluates individual room performance using bookings,
      booked nights, revenue, occupancy, and revenue efficiency.

    columns:

      - name: room_id
        description: "Unique identifier of the room."
        tests:
          - not_null
          - unique

      - name: hotel_id
        description: "Hotel to which the room belongs."
        tests:
          - not_null

      - name: total_bookings
        description: "Total confirmed and completed bookings for the room."

      - name: booked_room_nights
        description: "Total booked nights for the room."

      - name: operable_room_nights
        description: "Total operational room nights."

      - name: occupancy_percentage
        description: "Room occupancy percentage."

      - name: total_revenue_inr
        description: "Total revenue generated by the room."


  # ============================================================
  # 9. SEASONALITY ANALYSIS
  # ============================================================

  - name: seasonality_analysis
    description: >
      Analyzes historical booking and revenue patterns by calendar month
      to identify high, normal, and low season periods.

    columns:

      - name: month_number
        description: "Calendar month number from 1 to 12."
        tests:
          - not_null

      - name: month_name
        description: "Calendar month name."
        tests:
          - not_null

      - name: total_bookings
        description: "Total confirmed and completed bookings for the month across all years."

      - name: total_revenue_inr
        description: "Total revenue generated during the month across all years."

      - name: revenue_contribution_percentage
        description: "Percentage contribution of the month to total historical revenue."

      - name: revenue_rank
        description: "Ranking of months based on historical revenue."

      - name: season_category
        description: "High, normal, or low season classification."


  # ============================================================
  # 10. HOTEL EXECUTIVE PERFORMANCE
  # ============================================================

  - name: hotel_executive_performance
    description: >
      Executive-level hotel performance summary combining revenue,
      bookings, customers, room nights, occupancy, revenue efficiency,
      and hotel rankings.

    columns:

      - name: hotel_id
        description: "Unique identifier of the hotel."
        tests:
          - not_null
          - unique

      - name: hotel_name
        description: "Name of the hotel."
        tests:
          - not_null

      - name: total_rooms
        description: "Total operational rooms belonging to the hotel."

      - name: total_bookings
        description: "Total confirmed and completed bookings."

      - name: unique_customers
        description: "Number of unique customers."

      - name: total_revenue_inr
        description: "Total hotel revenue in INR."

      - name: average_booking_value
        description: "Average revenue generated per booking."

      - name: revenue_per_night
        description: "Average revenue generated per booked room night."

      - name: occupancy_percentage
        description: "Percentage of operable room nights that were booked."

      - name: revenue_rank
        description: "Hotel ranking based on total revenue."

      - name: occupancy_rank
        description: "Hotel ranking based on occupancy percentage."

      - name: performance_category
        description: >
          Executive classification of the hotel based on revenue ranking
          and occupancy performance.